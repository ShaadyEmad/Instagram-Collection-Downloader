name: Build & Release

# - Every push to main and every pull request: lint + build the .exe (downloadable as a workflow artifact).
# - Pushing a tag like v0.2.0: additionally publish a GitHub Release with the .exe attached.
# - "Run workflow" button: manual build.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXE_NAME: Instagram Collection Downloader

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uvx ruff check .

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP_VERSION=$(uv run python -c "import collection_downloader as c; print(c.__version__)")
          if [ "v$APP_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match collection_downloader.__version__ ($APP_VERSION)"
            exit 1
          fi

      - name: Build executable
        run: >
          uv run pyinstaller --noconfirm --onefile --windowed
          --name "$EXE_NAME"
          --collect-data customtkinter
          main.py

      - name: Check build output
        run: test -f "dist/$EXE_NAME.exe" && ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXE_NAME }}
          path: dist/${{ env.EXE_NAME }}.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.EXE_NAME }}.exe
          generate_release_notes: true
