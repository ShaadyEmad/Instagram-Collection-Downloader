[project]
name = "instagram-collection-downloader"
version = "0.3.0"
description = "Desktop app to download every reel from your private Instagram saved collections."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=6.0.0",
    "selenium>=4.52.0",
    "webdriver-manager>=4.1.2",
    "yt-dlp>=2026.10.26",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
